name: Job Scanner

"on":
  workflow_dispatch:

permissions:
  contents: write  # needed to commit seen_jobs.json back

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run job scanner
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m src.orchestrator

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save our generated file before touching git state
          cp seen_jobs.json /tmp/new_seen.json

          # Retry loop: fetch latest master, merge JSON files, commit, push
          for i in 1 2 3; do
            git fetch origin master
            git reset --hard FETCH_HEAD

            python3 - <<'PYEOF'
          import json
          with open('seen_jobs.json') as f:
              remote = json.load(f)
          with open('/tmp/new_seen.json') as f:
              new = json.load(f)
          with open('seen_jobs.json', 'w') as f:
              json.dump({**remote, **new}, f, indent=2)
          PYEOF

            git add seen_jobs.json
            git diff --staged --quiet && exit 0
            git commit -m "chore: update seen_jobs.json [skip ci]"
            git push origin master && exit 0
            sleep 5
          done
          exit 1

      - name: Notify on workflow failure
        if: failure()
        env:
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'EOF'
          import os, smtplib
          from email.mime.text import MIMEText

          gmail_from = os.environ["GMAIL_FROM"]
          app_password = os.environ["GMAIL_APP_PASSWORD"]

          msg = MIMEText(
              "The job scanner workflow failed on GitHub Actions.\n\n"
              "Check the run logs at:\n"
              "https://github.com/DORI2001/job-scanner/actions\n",
              "plain", "utf-8"
          )
          msg["Subject"] = "Job Scanner: workflow failed"
          msg["From"] = gmail_from
          msg["To"] = gmail_from

          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls()
              s.login(gmail_from, app_password)
              s.sendmail(gmail_from, [gmail_from], msg.as_string())
          EOF
